name: Generate Snake Animation

on:
  # প্রতিদিন রাত ১২টায় অটোমেটিক রান করবে (UTC সময়)
  schedule:
    - cron: "0 0 * * *" 
  
  # আপনি চাইলে ম্যানুয়ালিও রান করতে পারবেন
  workflow_dispatch:
  
  # মেইন ব্রাঞ্চে পুশ করলেও রান করবে
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Repository checkout করুন
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # Snake animation generate করুন  
      - name: 🐍 Generate contribution snake
        uses: Platane/snk@v3
        with:
          # আপনার GitHub username
          github_user_name: ${{ github.repository_owner }}
          
          # Output files - light এবং dark mode দুটোই
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Generate হওয়া files verify করুন
      - name: ✅ Verify generated files
        run: |
          echo "📋 Listing generated files:"
          ls -lah dist/
          echo "✨ Files generated successfully!"
      
      # Output branch এ push করুন
      - name: 🚀 Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 Update snake animations"
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # সফল হলে notification
      - name: 🎉 Success notification
        if: success()
        run: |
          echo "✅ Snake animation generated and deployed successfully!"
          echo "🔗 View at: https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.repository_owner }}/output/github-contribution-grid-snake-dark.svg"